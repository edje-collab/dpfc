        description: A unique integer value identifying this activite.
        required: true
      tags:
      - activites
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Activite'
          description: ''
