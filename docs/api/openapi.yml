openapi: 3.0.3
info:
  title: API du portail DPFC
  version: 3.0.0
  description: Plateforme de gestion de la Direction de la Pedagogie et de la Formation
    Continue.
paths:
  /api/v1/activites/:
    get:
      operationId: activites_list
      description: |-
        Activites du perimetre de l'agent.

        Le terrain consulte ses activites et rend compte de leur execution depuis
        le telephone, y compris hors du bureau.
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      tags:
      - activites
      security:
      - jwtAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedActiviteList'
          description: ''
  /api/v1/activites/{id}/:
    get:
      operationId: activites_retrieve
      description: |-
        Activites du perimetre de l'agent.

        Le terrain consulte ses activites et rend compte de leur execution depuis
        le telephone, y compris hors du bureau.
      parameters:
      - in: path
        name: id
