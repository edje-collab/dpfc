          type: string
        type:
          $ref: '#/components/schemas/ActiviteTypeEnum'
        type_libelle:
          type: string
          readOnly: true
        axe_code:
          type: string
          readOnly: true
        perimetre:
          type: string
          readOnly: true
        annee:
          type: integer
          readOnly: true
        responsable_nom:
          type: string
          readOnly: true
        lieu:
          type: string
          maxLength: 200
        public_cible:
          type: string
          maxLength: 200
        date_debut_prevue:
          type: string
          format: date
          title: Debut prevu
        date_fin_prevue:
          type: string
          format: date
          title: Fin prevue
        date_debut_reelle:
          type: string
          format: date
          nullable: true
          title: Debut reel
        date_fin_reelle:
          type: string
          format: date
          nullable: true
          title: Fin reelle
        statut:
          $ref: '#/components/schemas/ActiviteStatutEnum'
        statut_libelle:
          type: string
          readOnly: true
        avancement:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
          title: Avancement (%)
        est_en_retard:
          type: boolean
          readOnly: true
        jours_de_retard:
          type: integer
          readOnly: true
