          type: string
          format: decimal
          pattern: ^-?\d{0,14}(?:\.\d{0,0})?$
          title: Budget prevu (FCFA)
        budget_execute:
          type: string
          format: decimal
          pattern: ^-?\d{0,14}(?:\.\d{0,0})?$
          title: Budget execute (FCFA)
        effectif_prevu:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
          title: Beneficiaires prevus
        effectif_realise:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
          title: Beneficiaires touches
      required:
      - annee
      - axe_code
      - date_debut_prevue
      - date_fin_prevue
      - est_en_retard
      - id
      - intitule
      - jours_de_retard
      - perimetre
      - responsable_nom
      - statut_libelle
      - type_libelle
    ActiviteStatutEnum:
      enum:
      - PLANIFIEE
      - EN_COURS
      - REALISEE
      - REPORTEE
      - ANNULEE
