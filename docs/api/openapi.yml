      description: |-
        * `FORMATION` - Formation / renforcement de capacites
        * `ATELIER` - Atelier de production
        * `ELABORATION` - Elaboration de programmes ou de guides
        * `SUIVI` - Suivi pedagogique et encadrement
        * `EVALUATION` - Evaluation des acquis
        * `PRODUCTION` - Production de ressources
        * `REUNION` - Reunion et concertation
