# /etc/nginx/sites-available/dpfc
server {
    listen 80;
    server_name dpfc.education.ci www.dpfc.education.ci;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name dpfc.education.ci;

    ssl_certificate     /etc/letsencrypt/live/dpfc.education.ci/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dpfc.education.ci/privkey.pem;

    client_max_body_size 50M;

    location /static/ { alias /var/www/dpfc/staticfiles/; expires 30d; }
    location /media/  { alias /var/www/dpfc/media/; expires 7d; }

    location / {
        proxy_pass http://unix:/run/dpfc.sock;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
