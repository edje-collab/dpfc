# Pile de developpement : application, base, cache, stockage objet, courriels.
name: dpfc-dev

services:
  web:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile
      args: {DEV: "1"}
    command: python manage.py runserver 0.0.0.0:8000
    env_file: ../../.env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.dev
    volumes: ["../..:/app"]
    ports: ["8000:8000"]
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_started}

  worker:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile
      args: {DEV: "1"}
    command: celery -A config worker -l info
    env_file: ../../.env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.dev
    volumes: ["../..:/app"]
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_started}

  beat:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile
      args: {DEV: "1"}
    command: celery -A config beat -l info
    env_file: ../../.env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.dev
    volumes: ["../..:/app"]
    depends_on:
      redis: {condition: service_started}

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: dpfc
      POSTGRES_USER: dpfc
      POSTGRES_PASSWORD: dpfc
    volumes: ["donnees-postgres:/var/lib/postgresql/data"]
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dpfc"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio-dpfc
      MINIO_ROOT_PASSWORD: minio-dpfc-secret
    volumes: ["donnees-minio:/data"]
    ports: ["9000:9000", "9001:9001"]

  mailpit:
    image: axllent/mailpit
    ports: ["8026:8025", "1025:1025"]

volumes:
  donnees-postgres:
  donnees-minio:
